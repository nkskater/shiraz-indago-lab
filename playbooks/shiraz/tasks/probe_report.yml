---
# Runs on the application server. Prints what the SQL probe saw since
# probe_since (epoch seconds).
- name: Wait for the application server
  ansible.builtin.wait_for_connection:
    timeout: "{{ probe_recovery_timeout | default(600) }}"

# The event is over for the application once the probe passes again. A guest
# that was restarted needs a while for SQL Server to come back up.
- name: Wait until the last 10 seconds of the SQL probe are clean
  ansible.builtin.shell:
    cmd: sqlcheck-report $(( $(date +%s) - 10 ))
  register: probe_recent
  changed_when: false
  check_mode: false
  until:
    - (probe_recent.stdout | from_json).fail == 0
    - (probe_recent.stdout | from_json).pass >= 5
  retries: "{{ (probe_recovery_timeout | default(600) | int / 5) | int }}"
  delay: 5

- name: Summarise the SQL probe over the event
  ansible.builtin.command:
    cmd: "sqlcheck-report {{ probe_since | float | int - 5 }}"
  register: probe_report
  changed_when: false
  check_mode: false

- name: Report what the application saw
  ansible.builtin.debug:
    msg:
      - "SQL probe on {{ inventory_hostname }} ({{ probe_label }}):"
      - "  samples {{ probe.samples }}, pass {{ probe.pass }}, fail {{ probe.fail }}"
      - "  database unreachable for about {{ probe.downtime_seconds }} s{{ probe_window }}"
      - "  longest silence of the probe itself {{ probe.max_gap_seconds }} s{{ probe_silence_note }}"
  vars:
    probe: "{{ probe_report.stdout | from_json }}"
    probe_silence_note: >-
      {{ ' - the application server was paused or down for that long' if probe.max_gap_seconds | float > 10 else '' }}
    probe_window: >-
      {{ (' (' ~ probe.first_fail ~ ' to ' ~ (probe.recovered | default('still failing', true)) ~ ')')
         if probe.fail else '' }}
