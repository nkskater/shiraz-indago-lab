[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ansible
private_key_file = ~/.ssh/ansible
forks = 10
callback_result_format = yaml
retry_files_enabled = False
vault_identity_list = shiraz@~/.config/ansible/shiraz_vault_pass

[privilege_escalation]
become = True

[ssh_connection]
retries = 3
# Lab machines are rebuilt often, so their host keys live in a separate file
# (trust on first use) instead of polluting ~/.ssh/known_hosts. Hosts already
# in ~/.ssh/known_hosts, such as the physical node, are still checked strictly.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=~/.ssh/known_hosts_shiraz_lab ~/.ssh/known_hosts"
