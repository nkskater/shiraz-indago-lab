---
# Internal values - not meant to be overridden.
pve_host__fqdn: "{{ inventory_hostname }}.{{ pve_host_domain }}"

pve_host__installed: "{{ 'install ok installed' in (pve_host__dpkg.stdout | default('')) }}"

# MAC address of the NIC that carries the host address. Before the bridge
# exists that is the default-route interface; afterwards it is the pinned NIC.
pve_host__uplink_mac: >-
  {{ ansible_facts[pve_host_uplink_name]['macaddress']
     if pve_host_uplink_name in ansible_facts['interfaces']
     else ansible_facts['default_ipv4']['macaddress'] }}

# Block device of the root filesystem (e.g. /dev/sdb1), and the stable
# /dev/disk/by-id path of the disk it sits on.
pve_host__root_device: >-
  {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}
pve_host__boot_disk: >-
  {{ '/dev/disk/by-id/' ~ (ansible_facts['device_links']['ids'][pve_host__root_disk.stdout | trim] | first)
     if ansible_facts['device_links']['ids'][pve_host__root_disk.stdout | trim] | default([]) | length > 0
     else '/dev/' ~ (pve_host__root_disk.stdout | trim) }}
