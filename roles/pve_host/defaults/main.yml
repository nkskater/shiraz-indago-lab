---
# --- Identity and network ----------------------------------------------------
pve_host_domain: internal
pve_host_address: "{{ ansible_host }}"
pve_host_prefix: 24
pve_host_gateway: ""
pve_host_nameservers: []
pve_host_timezone: Etc/UTC

# Every node of the future cluster, for /etc/hosts: [{ name: ..., address: ... }]
# Proxmox needs each node name to resolve to its real address, never 127.0.1.1.
pve_host_cluster_hosts: []

# Guest bridge, and the fixed name given to the NIC underneath it. Pinning the
# name by MAC address (as Proxmox VE 9 does with "nicN") keeps the bridge
# working regardless of how the kernel would otherwise name the interface.
pve_host_bridge: vmbr0
pve_host_uplink_name: nic0

# --- Packages and repositories -----------------------------------------------
pve_host_repo_uri: http://download.proxmox.com/debian/pve
pve_host_enterprise_repo_uri: https://enterprise.proxmox.com/debian/pve
pve_host_keyring_path: /usr/share/keyrings/proxmox-archive-keyring.gpg
pve_host_keyring_url: >-
  https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ ansible_facts['distribution_release'] }}.gpg
# Published on https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie
pve_host_keyring_checksum: sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
pve_host_packages:
  - proxmox-ve
  - postfix
  - open-iscsi
  - chrony
# Stock Debian kernels, removed once the Proxmox kernel is running.
pve_host_debian_kernel_packages:
  - linux-image-amd64
  - linux-image-cloud-amd64
  - "linux-image-6.12*"

# --- Access ------------------------------------------------------------------
# sha512-crypt hash for root (web UI login, cluster join). Empty = leave alone.
pve_host_root_password_hash: ""
# Same defaults as a Proxmox VE install from the ISO.
pve_host_sshd_password_authentication: true
pve_host_sshd_permit_root_login: "yes"

pve_host_reboot_timeout: 600
