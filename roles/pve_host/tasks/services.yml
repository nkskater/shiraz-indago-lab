---
- name: Install the QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Ensure the QEMU guest agent is running
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Ensure chrony is running and enabled at boot
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
