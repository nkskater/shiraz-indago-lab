---
# --- Boot loader --------------------------------------------------------------

- name: Check whether the host booted through UEFI
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: pve_host__uefi

# The Proxmox kernel pulls in grub-pc. On a BIOS-booted cloud image nothing has
# told grub-pc where the boot loader lives, and its installer fails without an
# answer. Point it at the disk that holds the root filesystem, by stable ID
# (sdX names can swap between boots).
- name: Find the disk that holds the root filesystem
  ansible.builtin.command:
    cmd: "lsblk -ndo PKNAME {{ pve_host__root_device }}"
  register: pve_host__root_disk
  changed_when: false
  check_mode: false

- name: Tell grub-pc where to install the boot loader
  ansible.builtin.debconf:
    name: grub-pc
    question: grub-pc/install_devices
    vtype: multiselect
    value: "{{ pve_host__boot_disk }}"
  when: not pve_host__uefi.stat.exists

# --- Kernel -----------------------------------------------------------------

- name: Bring Debian fully up to date before the first install
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
  when: not pve_host__installed

- name: Install the Proxmox VE kernel
  ansible.builtin.apt:
    name: proxmox-default-kernel
    state: present

- name: Reboot into the Proxmox VE kernel
  ansible.builtin.reboot:
    reboot_timeout: "{{ pve_host_reboot_timeout }}"
  when: "'pve' not in ansible_facts['kernel']"

- name: Re-read the running kernel
  ansible.builtin.setup:
    filter:
      - ansible_kernel
  when: "'pve' not in ansible_facts['kernel']"

- name: Check that the Proxmox VE kernel is running
  ansible.builtin.assert:
    that:
      - "'pve' in ansible_facts['kernel']"
    fail_msg: "Still running {{ ansible_facts['kernel'] }} after the reboot."
    quiet: true
  when: not ansible_check_mode

# --- Packages ---------------------------------------------------------------

- name: Answer the postfix installer questions
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop:
    - { question: postfix/main_mailer_type, vtype: select, value: Local only }
    - { question: postfix/mailname, vtype: string, value: "{{ pve_host__fqdn }}" }
  loop_control:
    label: "{{ item.question }}"

- name: Install Proxmox VE
  ansible.builtin.apt:
    name: "{{ pve_host_packages }}"
    state: present

# --- Clean-up ---------------------------------------------------------------

- name: Remove the stock Debian kernel
  ansible.builtin.apt:
    name: "{{ pve_host_debian_kernel_packages }}"
    state: absent
    purge: true
  notify: Update grub

- name: Remove os-prober
  ansible.builtin.apt:
    name: os-prober
    state: absent

# The proxmox-ve packages may add this file; without a subscription it only
# makes "apt update" fail with HTTP 401, so keep it present but switched off.
- name: Keep the enterprise repository disabled
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    types: deb
    uris: "{{ pve_host_enterprise_repo_uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: pve-enterprise
    signed_by: "{{ pve_host_keyring_path }}"
    enabled: false
    state: present
  notify: Update apt cache

- name: Remove repository files that need a subscription
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - ceph.sources
    - pve-install-repo.sources
  notify: Update apt cache
