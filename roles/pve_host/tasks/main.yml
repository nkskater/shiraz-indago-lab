---
# Follows https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Hostname, name resolution and time zone
  ansible.builtin.import_tasks: base.yml

- name: Proxmox package repository
  ansible.builtin.import_tasks: repos.yml

- name: Proxmox VE kernel and packages
  ansible.builtin.import_tasks: install.yml

# Access and the guest agent come before the network change on purpose: if the
# host does not come back, the console and "qm guest exec" still work.
- name: Root password and SSH daemon
  ansible.builtin.import_tasks: access.yml

- name: Guest agent and time service
  ansible.builtin.import_tasks: services.yml

- name: Bridge networking
  ansible.builtin.import_tasks: network.yml

- name: Final checks
  ansible.builtin.import_tasks: verify.yml
