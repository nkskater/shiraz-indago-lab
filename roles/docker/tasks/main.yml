---
# Follows https://docs.docker.com/engine/install/ubuntu/ (apt repository method).

- name: Install what the repository tasks need
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's signing key
  ansible.builtin.get_url:
    url: "{{ docker_keyring_url }}"
    dest: "{{ docker_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: "{{ docker_keyring_path }}"
    state: present
  notify: Update apt cache

- name: Refresh the package index now if the repository changed
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure Docker is running and enabled at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let selected users run docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
