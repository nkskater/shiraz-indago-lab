---
# Creates one container per inventory host, from the control node. The play
# using this role needs gather_facts: false.

- name: Manage the container through the Proxmox API
  delegate_to: localhost
  become: false
  module_defaults:
    group/community.proxmox.proxmox: "{{ pve_container_api }}"
  block:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - pve_container_api.api_host | default('') | length > 0
          - pve_container_node | length > 0
          - pve_container_vmid | int > 0
          - pve_container_ostemplate | length > 0
          - pve_container_storage | length > 0
          - pve_container_gateway | length > 0
          - pve_container_root_public_key | length > 0
        quiet: true

    - name: Look up the VMID
      community.proxmox.proxmox_vm_info:
        vmid: "{{ pve_container_vmid }}"
      register: pve_container__lookup

    - name: Refuse to reuse a VMID that belongs to something else
      ansible.builtin.assert:
        that:
          - pve_container__lookup.proxmox_vms[0].name == pve_container_hostname
        fail_msg: >-
          VMID {{ pve_container_vmid }} is already used by
          '{{ pve_container__lookup.proxmox_vms[0].name | default('?') }}'. Not touching it.
        quiet: true
      when: pve_container__exists

    - name: Probe the container's address before creating it
      ansible.builtin.command:
        cmd: "ping -c 2 -W 1 {{ pve_container_ip }}"
      register: pve_container__ping
      changed_when: false
      failed_when: false
      check_mode: false
      when: not pve_container__exists

    - name: Refuse to create a container on an address that is already in use
      ansible.builtin.assert:
        that:
          - pve_container__ping.rc != 0
        fail_msg: "{{ pve_container_ip }} already answers ping. Pick a free address for {{ pve_container_hostname }}."
        quiet: true
      when: not pve_container__exists

    - name: Create the container
      community.proxmox.proxmox:
        node: "{{ pve_container_node }}"
        vmid: "{{ pve_container_vmid }}"
        hostname: "{{ pve_container_hostname }}"
        description: "{{ pve_container_description }}"
        ostemplate: "{{ pve_container_ostemplate }}"
        disk_volume:
          storage: "{{ pve_container_storage }}"
          size: "{{ pve_container_disk_gb }}"
        cores: "{{ pve_container_cores }}"
        memory: "{{ pve_container_memory_mb }}"
        swap: "{{ pve_container_swap_mb }}"
        netif:
          net0: "{{ pve_container__net0 }}"
        nameserver: "{{ pve_container_nameserver | default(omit, true) }}"
        searchdomain: "{{ pve_container_search_domain | default(omit, true) }}"
        pubkey: "{{ pve_container_root_public_key }}"
        unprivileged: "{{ pve_container_unprivileged }}"
        onboot: "{{ pve_container_onboot }}"
        pool: "{{ pve_container_pool | default(omit, true) }}"
        update: false
        timeout: 300
        state: present
      when: not pve_container__exists

    # Tags are set in a second step: Proxmox checks tag permissions on the
    # guest itself, and a pool-scoped token only has rights on a guest once it
    # is a member of the pool.
    - name: Read the container's current tags
      community.proxmox.proxmox_vm_info:
        vmid: "{{ pve_container_vmid }}"
      register: pve_container__info

    - name: Tag the container
      community.proxmox.proxmox:
        node: "{{ pve_container_node }}"
        vmid: "{{ pve_container_vmid }}"
        hostname: "{{ pve_container_hostname }}"
        tags: "{{ pve_container_tags }}"
        # Proxmox's own default. Without it the module's update path sends
        # cmode=default, which the API rejects (community.proxmox 2.0.0).
        cmode: tty
        update: true
        state: present
      when:
        - pve_container__info.proxmox_vms | length > 0
        - pve_container__current_tags != (pve_container_tags | sort | join(';'))

    - name: Start the container
      community.proxmox.proxmox:
        node: "{{ pve_container_node }}"
        vmid: "{{ pve_container_vmid }}"
        state: started
        timeout: 120

    - name: Wait for SSH to come up
      ansible.builtin.wait_for:
        host: "{{ pve_container_ip }}"
        port: 22
        timeout: "{{ pve_container_boot_timeout }}"
